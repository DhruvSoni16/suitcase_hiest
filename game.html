<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Crack the Code · Suitcase Heist</title>
  <meta name="description" content="A 3-digit suitcase lock puzzle. Crack the code to win." />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0a0e1a;
      color: #e8eef7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(99, 180, 255, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(255, 140, 50, 0.08) 0%, transparent 60%),
        #0a0e1a;
    }
    .heist-stage {
      width: 100%;
      max-width: 560px;
      padding: 28px 20px;
      position: relative;
    }
    .heist-header {
      text-align: center;
      margin-bottom: 18px;
      position: relative;
      padding-top: 28px;
    }
    .back-link {
      position: absolute;
      top: 6px;
      left: 0;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4a5a73;
      text-decoration: none;
      transition: color 0.2s;
      padding: 6px 10px;
    }
    .back-link:hover { color: var(--accent, #6ad0ff); }
    .team-tag {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 4px;
      font-size: 22px;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--accent, #6ad0ff);
      font-weight: 600;
      text-shadow: 0 0 20px var(--accent-glow, rgba(106, 208, 255, 0.4));
    }
    .team-tag.loading {
      opacity: 0.4;
      font-size: 14px;
      letter-spacing: 3px;
    }
    .team-tag.error {
      color: #ff5a4a;
    }
    .heist-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 5px;
      color: var(--accent, #6ad0ff);
      text-transform: uppercase;
      margin: 0;
      opacity: 0.85;
    }
    .heist-sub {
      font-size: 11px;
      color: #7a8aa3;
      margin: 6px 0 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .case-wrap {
      position: relative;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      aspect-ratio: 1.5 / 1;
      perspective: 1400px;
    }
    .case {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: idle 5s ease-in-out infinite;
    }
    @keyframes idle {
      0%, 100% { transform: rotateX(8deg) rotateY(-2deg); }
      50% { transform: rotateX(9deg) rotateY(2deg); }
    }
    .case.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97); }
    @keyframes shake {
      10%, 90% { transform: rotateX(8deg) translateX(-2px); }
      20%, 80% { transform: rotateX(8deg) translateX(4px); }
      30%, 50%, 70% { transform: rotateX(8deg) translateX(-7px); }
      40%, 60% { transform: rotateX(8deg) translateX(7px); }
    }
    .lid, .body-pc {
      position: absolute;
      left: 6%;
      right: 6%;
      background: linear-gradient(180deg, #3a2a1a 0%, #2a1d10 50%, #1f1408 100%);
      border: 1px solid #0a0604;
      box-shadow:
        inset 0 2px 0 rgba(255, 200, 150, 0.08),
        inset 0 -2px 0 rgba(0, 0, 0, 0.5),
        0 12px 30px rgba(0, 0, 0, 0.6);
    }
    .lid {
      top: 4%;
      height: 38%;
      border-radius: 14px 14px 4px 4px;
      transform-origin: bottom center;
      transform: rotateX(0deg);
      transition: transform 1.4s cubic-bezier(.68,-0.05,.27,1.2);
      z-index: 2;
    }
    .case.open .lid { transform: rotateX(-115deg); }
    .body-pc {
      top: 38%;
      height: 56%;
      border-radius: 4px 4px 14px 14px;
    }
    .lid::before, .body-pc::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      border: 1px dashed rgba(255, 200, 150, 0.15);
      border-radius: 8px;
      pointer-events: none;
    }
    .lid::before { top: 8px; bottom: 8px; }
    .body-pc::after { top: 8px; bottom: 8px; border-radius: 4px 4px 8px 8px; }
    .handle {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 22px;
      background: linear-gradient(180deg, #4a3520 0%, #2a1d10 100%);
      border: 1px solid #0a0604;
      border-radius: 12px 12px 4px 4px;
      box-shadow: inset 0 1px 0 rgba(255,200,150,0.1);
    }
    .handle::after {
      content: "";
      position: absolute;
      inset: 4px 8px 0;
      border: 1px solid rgba(0,0,0,0.4);
      border-radius: 8px 8px 0 0;
    }
    .stud {
      position: absolute;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 35% 35%, #c9a878 0%, #6b4a28 60%, #3a2410 100%);
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .stud.tl { top: 8px; left: 8px; }
    .stud.tr { top: 8px; right: 8px; }
    .stud.bl { bottom: 8px; left: 8px; }
    .stud.br { bottom: 8px; right: 8px; }
    .lock-plate {
      position: absolute;
      top: 24%;
      left: 50%;
      transform: translateX(-50%);
      width: 58%;
      max-width: 240px;
      height: 78px;
      background: linear-gradient(180deg, #d9c598 0%, #a08858 50%, #6b5530 100%);
      border: 1px solid #3a2a10;
      border-radius: 10px;
      box-shadow:
        inset 0 1px 0 rgba(255, 240, 200, 0.5),
        inset 0 -2px 4px rgba(0, 0, 0, 0.4),
        0 4px 8px rgba(0, 0, 0, 0.5);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 10px;
    }
    .dial {
      width: 38px;
      height: 60px;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow:
        inset 0 0 12px rgba(0, 0, 0, 0.9),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      cursor: pointer;
      flex: 1;
      max-width: 56px;
    }
    .dial::before, .dial::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 14px;
      pointer-events: none;
      z-index: 2;
    }
    .dial::before { top: 0; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); }
    .dial::after { bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%); }
    .dial-window {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,180,80,0.4), transparent);
      transform: translateY(-1px);
      z-index: 3;
      pointer-events: none;
    }
    .dial-strip {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.35s cubic-bezier(.34,1.4,.64,1);
    }
    .dial-num {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", monospace;
      font-size: 30px;
      font-weight: 700;
      color: #e8d9b0;
      text-shadow: 0 0 6px rgba(255, 180, 80, 0.5);
      flex-shrink: 0;
    }
    .dial.active {
      box-shadow:
        inset 0 0 12px rgba(0,0,0,0.9),
        0 0 0 2px var(--accent, #6ad0ff),
        0 0 12px rgba(106,208,255,0.6);
    }
    .latch {
      position: absolute;
      top: 28%;
      width: 36px;
      height: 50px;
      background: linear-gradient(180deg, #d9c598 0%, #8a7548 100%);
      border: 1px solid #3a2a10;
      border-radius: 6px;
      box-shadow: inset 0 1px 0 rgba(255,240,200,0.5), 0 2px 4px rgba(0,0,0,0.5);
      z-index: 3;
    }
    .latch.left { left: 12%; }
    .latch.right { right: 12%; }
    .latch::after {
      content: "";
      position: absolute;
      inset: 8px 6px;
      background: #0d0d0d;
      border-radius: 3px;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
    }
    .interior {
      position: absolute;
      top: 38%;
      left: 6%;
      right: 6%;
      height: 56%;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(255, 220, 120, 0.4) 0%, transparent 70%),
        linear-gradient(180deg, #2a1a08 0%, #1a0f04 100%);
      border-radius: 4px 4px 14px 14px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.6s 0.4s;
    }
    .case.open .interior { opacity: 1; }
    .loot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.8s 0.7s cubic-bezier(.34,1.56,.64,1);
      text-align: center;
    }
    .case.open .loot { transform: translate(-50%, -50%) scale(1); }
    .gold-stack {
      width: 120px;
      height: 60px;
      background: linear-gradient(180deg, #ffd966 0%, #c99b1f 100%);
      border: 1px solid #8a6a10;
      border-radius: 4px;
      box-shadow:
        0 -8px 0 -2px #e6c44a,
        0 -16px 0 -4px #ccab2c,
        0 8px 16px rgba(255, 200, 50, 0.4);
      margin: 0 auto 12px;
    }
    .loot-label {
      font-size: 11px;
      color: #ffd966;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hud {
      margin-top: 22px;
      background: rgba(20, 28, 44, 0.7);
      border: 1px solid rgba(106, 208, 255, 0.2);
      border-radius: 10px;
      padding: 16px;
      position: relative;
      z-index: 5;
    }
    .display {
      background: #050810;
      border: 1px solid #1a2438;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      font-family: "Courier New", monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--accent, #6ad0ff);
      letter-spacing: 12px;
      text-shadow: 0 0 8px rgba(106, 208, 255, 0.6);
      margin-bottom: 12px;
      min-height: 44px;
      box-shadow: inset 0 0 16px rgba(106, 208, 255, 0.1);
    }
    .display.denied {
      color: #ff5a4a !important;
      text-shadow: 0 0 8px rgba(255, 90, 74, 0.6) !important;
      border-color: #5a1818;
      animation: deny-flash 0.5s;
    }
    .display.success {
      color: #5cd97c !important;
      text-shadow: 0 0 12px rgba(92, 217, 124, 0.8) !important;
      border-color: #185a28;
      animation: success-flicker 1.2s;
    }
    .display.waiting {
      color: #4a5a73;
      text-shadow: none;
    }
    @keyframes deny-flash {
      0%, 100% { background: #050810; }
      50% { background: #2a0808; }
    }
    @keyframes success-flicker {
      0%, 30%, 50%, 70%, 100% { opacity: 1; }
      40%, 60% { opacity: 0.5; }
    }
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .num-btn {
      background: linear-gradient(180deg, #1e2a44 0%, #131a2b 100%);
      border: 1px solid rgba(106, 208, 255, 0.25);
      border-radius: 6px;
      color: #e8eef7;
      font-family: "Courier New", monospace;
      font-size: 20px;
      font-weight: 700;
      padding: 14px 0;
      cursor: pointer;
      transition: all 0.12s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .num-btn:hover {
      background: linear-gradient(180deg, #2a3a5c 0%, #1a2440 100%);
      border-color: rgba(106, 208, 255, 0.5);
      box-shadow: 0 0 12px rgba(106, 208, 255, 0.2);
    }
    .num-btn:active { transform: scale(0.94); }
    .num-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .num-btn.clear { color: #ff8a7a; }
    .num-btn.submit {
      background: linear-gradient(180deg, #1a4a28 0%, #0d2a18 100%);
      border-color: rgba(92, 217, 124, 0.5);
      color: #9af0b0;
    }
    .num-btn.submit:hover {
      background: linear-gradient(180deg, #2a6a3c 0%, #1a4028 100%);
      box-shadow: 0 0 12px rgba(92, 217, 124, 0.3);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #7a8aa3;
      letter-spacing: 1px;
      margin-top: 8px;
    }
    .meta strong { color: var(--accent, #6ad0ff); font-weight: 500; }
    .toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: rgba(10, 30, 18, 0.95);
      border: 1px solid #5cd97c;
      color: #9af0b0;
      padding: 16px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(.34,1.56,.64,1);
      z-index: 20;
      text-shadow: 0 0 8px rgba(92, 217, 124, 0.6);
      box-shadow: 0 0 40px rgba(92, 217, 124, 0.4);
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: toast-flicker 1.8s;
    }
    @keyframes toast-flicker {
      0%, 100% { opacity: 1; }
      20%, 60% { opacity: 0.7; }
      40%, 80% { opacity: 1; }
    }
    .hint-pill {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(106, 208, 255, 0.1);
      border: 1px solid rgba(106, 208, 255, 0.3);
      border-radius: 12px;
      font-size: 10px;
      color: var(--accent, #6ad0ff);
      letter-spacing: 1px;
    }
    .error-screen {
      text-align: center;
      padding: 60px 20px;
    }
    .error-screen h1 {
      color: #ff5a4a;
      font-size: 18px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0 0 12px;
    }
    .error-screen p {
      color: #7a8aa3;
      font-size: 13px;
      line-height: 1.6;
      margin: 6px 0;
    }
    .error-screen code {
      background: rgba(106, 208, 255, 0.1);
      border: 1px solid rgba(106, 208, 255, 0.2);
      border-radius: 4px;
      padding: 2px 8px;
      color: #6ad0ff;
      font-family: "Courier New", monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="heist-stage" id="stage">
  <div class="heist-header">
    <a class="back-link" href="/" id="back-link">← Switch faction</a>
    <div class="team-tag loading" id="team-tag">Loading…</div>
    <p class="heist-title" id="heist-title">Crack the Code · Suitcase Heist</p>
    <p class="heist-sub" id="heist-sub">A 3-digit lock stands between you and the score</p>
  </div>

  <div class="case-wrap">
    <div class="case" id="case">
      <div class="lid">
        <div class="handle"></div>
        <div class="stud tl"></div><div class="stud tr"></div>
        <div class="stud bl"></div><div class="stud br"></div>
        <div class="lock-plate">
          <div class="dial" data-i="0">
            <div class="dial-strip" id="strip-0"></div>
            <div class="dial-window"></div>
          </div>
          <div class="dial" data-i="1">
            <div class="dial-strip" id="strip-1"></div>
            <div class="dial-window"></div>
          </div>
          <div class="dial" data-i="2">
            <div class="dial-strip" id="strip-2"></div>
            <div class="dial-window"></div>
          </div>
        </div>
        <div class="latch left"></div>
        <div class="latch right"></div>
      </div>
      <div class="interior">
        <div class="loot">
          <div class="gold-stack"></div>
          <div class="loot-label" id="loot-label">★ Score secured ★</div>
        </div>
      </div>
      <div class="body-pc">
        <div class="stud tl"></div><div class="stud tr"></div>
        <div class="stud bl"></div><div class="stud br"></div>
      </div>
    </div>
    <div class="toast" id="toast">You cracked the code</div>
  </div>

  <div class="hud">
    <div class="display waiting" id="display">- - -</div>
    <div class="numpad" id="numpad">
      <button class="num-btn" data-n="1">1</button>
      <button class="num-btn" data-n="2">2</button>
      <button class="num-btn" data-n="3">3</button>
      <button class="num-btn" data-n="4">4</button>
      <button class="num-btn" data-n="5">5</button>
      <button class="num-btn" data-n="6">6</button>
      <button class="num-btn" data-n="7">7</button>
      <button class="num-btn" data-n="8">8</button>
      <button class="num-btn" data-n="9">9</button>
      <button class="num-btn clear" id="clear">Clr</button>
      <button class="num-btn" data-n="0">0</button>
      <button class="num-btn submit" id="submit">↵</button>
    </div>
    <div class="meta">
      <span>Attempts: <strong id="attempts">0</strong></span>
      <span class="hint-pill">3 digits · 0-9</span>
      <span>Best: <strong id="best">—</strong></span>
    </div>
  </div>
</div>

<script>
(function () {
  // -------- read team from URL --------
  const params = new URLSearchParams(window.location.search);
  const teamId = (params.get("team") || "").toLowerCase().trim();

  const stage = document.getElementById("stage");
  const teamTag = document.getElementById("team-tag");

  if (!teamId) {
    stage.innerHTML =
      '<div class="error-screen">' +
      "<h1>No faction selected</h1>" +
      "<p>This game needs a faction in the URL.</p>" +
      '<p><a href="/" style="color:#6ad0ff;text-decoration:none;letter-spacing:2px;">← Choose your faction</a></p>' +
      "</div>";
    return;
  }

  // Disable controls until team info loads
  const allButtons = document.querySelectorAll(".num-btn");
  allButtons.forEach((b) => (b.disabled = true));

  // Fetch team metadata (name + tagline + accent), but NOT the code.
  fetch("/api/team?id=" + encodeURIComponent(teamId))
    .then((r) => {
      if (!r.ok) throw new Error("not-found");
      return r.json();
    })
    .then((team) => {
      document.documentElement.style.setProperty("--accent", team.accent);
      // Build a glow color from the accent hex
      const glow = hexToRgba(team.accent, 0.4);
      document.documentElement.style.setProperty("--accent-glow", glow);
      teamTag.textContent = team.name;
      teamTag.classList.remove("loading");
      // Show tagline in the subtitle, faction-themed
      document.getElementById("heist-sub").textContent = team.tagline + " · 3-digit lock";
      document.title = team.name + " · Crack the Code";
      allButtons.forEach((b) => (b.disabled = false));
      initGame(teamId);
    })
    .catch(() => {
      stage.innerHTML =
        '<div class="error-screen">' +
        "<h1>Unknown faction</h1>" +
        '<p>The faction <code>' + escapeHtml(teamId) + '</code> is not configured.</p>' +
        '<p><a href="/" style="color:#6ad0ff;text-decoration:none;letter-spacing:2px;">← Choose your faction</a></p>' +
        "</div>";
    });

  function hexToRgba(hex, alpha) {
    const m = hex.replace("#", "").match(/.{2}/g);
    if (!m) return "rgba(106,208,255," + alpha + ")";
    const [r, g, b] = m.map((h) => parseInt(h, 16));
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);
  }

  // -------- game logic (only runs once team is verified) --------
  function initGame(team) {
    const caseEl = document.getElementById("case");
    const display = document.getElementById("display");
    const toast = document.getElementById("toast");
    const attemptsEl = document.getElementById("attempts");
    const bestEl = document.getElementById("best");
    const numpad = document.getElementById("numpad");

    let input = [];
    let attempts = 0;
    let best = null;
    let solved = false;
    let submitting = false;

    // Build dial strips: 0..9
    for (let d = 0; d < 3; d++) {
      const strip = document.getElementById("strip-" + d);
      for (let n = 0; n <= 9; n++) {
        const div = document.createElement("div");
        div.className = "dial-num";
        div.textContent = n;
        strip.appendChild(div);
      }
    }

    // ---- audio ----
    let audioCtx = null;
    function audio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { return null; }
      }
      return audioCtx;
    }
    function tone(freq, dur, type, gain) {
      const ctx = audio(); if (!ctx) return;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      g.gain.value = 0;
      g.gain.linearRampToValueAtTime(gain || 0.15, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + dur);
    }
    function click() { tone(1200, 0.04, "square", 0.08); }
    function deny() {
      tone(220, 0.15, "sawtooth", 0.12);
      setTimeout(() => tone(180, 0.2, "sawtooth", 0.12), 100);
    }
    function success() {
      [523, 659, 784, 1047].forEach((f, i) => {
        setTimeout(() => tone(f, 0.25, "triangle", 0.14), i * 90);
      });
    }
    function thud() { tone(80, 0.3, "sine", 0.2); }

    // ---- rendering ----
    function renderDisplay(state) {
      const slots = [0, 1, 2].map((i) => (input[i] !== undefined ? input[i] : "-"));
      display.textContent = slots.join(" ");
      display.className = "display" + (state ? " " + state : "");
    }
    function setDial(i, value, animate) {
      const strip = document.getElementById("strip-" + i);
      strip.style.transition = animate
        ? "transform 0.4s cubic-bezier(.34,1.4,.64,1)"
        : "none";
      strip.style.transform = "translateY(" + (-value * 60 - 30) + "px)";
    }
    function highlightDial(i) {
      document.querySelectorAll(".dial").forEach((d) => d.classList.remove("active"));
      if (i >= 0 && i < 3) {
        document.querySelector('.dial[data-i="' + i + '"]').classList.add("active");
      }
    }

    // ---- input handlers ----
    function pressNum(n) {
      if (solved || submitting) return;
      if (input.length >= 3) return;
      input.push(n);
      setDial(input.length - 1, n, true);
      click();
      renderDisplay();
      highlightDial(input.length);
      if (input.length === 3) setTimeout(submit, 350);
    }
    function clearInput() {
      if (solved || submitting) return;
      input = [];
      for (let i = 0; i < 3; i++) setDial(i, 0, true);
      renderDisplay();
      highlightDial(0);
      click();
    }

    async function submit() {
      if (solved || submitting || input.length !== 3) return;
      submitting = true;
      attempts++;
      attemptsEl.textContent = attempts;

      try {
        const res = await fetch("/api/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ team, guess: input }),
        });
        const data = await res.json();

        if (data.correct) {
          solved = true;
          renderDisplay("success");
          success();
          setTimeout(() => {
            caseEl.classList.add("open");
            toast.classList.add("show");
            thud();
          }, 250);
          if (best === null || attempts < best) {
            best = attempts;
            bestEl.textContent = best;
          }
          setTimeout(() => reset(), 4500);
        } else {
          renderDisplay("denied");
          deny();
          caseEl.classList.add("shake");
          setTimeout(() => caseEl.classList.remove("shake"), 500);
          setTimeout(() => {
            input = [];
            for (let i = 0; i < 3; i++) {
              setDial(i, Math.floor(Math.random() * 10), true);
            }
            renderDisplay();
            highlightDial(0);
            submitting = false;
          }, 700);
        }
      } catch (err) {
        // network error — let the player try again
        deny();
        renderDisplay("denied");
        setTimeout(() => {
          input = [];
          for (let i = 0; i < 3; i++) setDial(i, 0, true);
          renderDisplay();
          highlightDial(0);
          submitting = false;
        }, 700);
      } finally {
        // for the success path we keep submitting=true until reset
        if (!solved) {
          // submitting will be flipped back in the timeout above
        }
      }
    }

    function reset() {
      solved = false;
      submitting = false;
      input = [];
      toast.classList.remove("show");
      caseEl.classList.remove("open");
      for (let i = 0; i < 3; i++) {
        setDial(i, Math.floor(Math.random() * 10), true);
      }
      setTimeout(() => {
        for (let i = 0; i < 3; i++) setDial(i, 0, true);
      }, 400);
      attempts = 0;
      attemptsEl.textContent = 0;
      renderDisplay();
      highlightDial(0);
    }

    // wire numpad
    numpad.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn || btn.disabled) return;
      if (btn.id === "clear") return clearInput();
      if (btn.id === "submit") return submit();
      const n = parseInt(btn.dataset.n, 10);
      if (!isNaN(n)) pressNum(n);
    });

    // keyboard
    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") pressNum(parseInt(e.key, 10));
      else if (e.key === "Enter") submit();
      else if (e.key === "Backspace" || e.key === "Escape") clearInput();
    });

    // init
    for (let i = 0; i < 3; i++) setDial(i, 0, false);
    renderDisplay();
    highlightDial(0);
  }
})();
</script>
</body>
</html>
